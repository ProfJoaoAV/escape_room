<script>
// ===== CONFIGURAÇÃO =====

{n:'Sala I · HGP — Dinastia de Avis',k:'hgp',a:'7',c:'#e8b94a',g:'232,185,74',h:35,i:'👑',t:'Contai a ordem de sucessão dos reis da Dinastia de Avis, desde o fundador até D. Sebastião. A posição de D. Sebastião é o dígito.'},
{n:'Sala II · Português — Profecia do Guardião',k:'port',a:'6',c:'#b48cff',g:'180,140,255',h:270,i:'📜',t:'Lede o papiro e contai todos os ADJETIVOS. O total é o dígito.'},
{n:'Sala III · English — The Foggy Forest',k:'eng',a:'2',c:'#6fe39a',g:'111,227,154',h:140,i:'🦊',t:'Count the animals: Red Foxes + Green Frogs − Black Cats = Secret Number.'},

{n:'Sala V · O Cofre de D. Sebastião',c:'#ff5a4a',g:'255,90,74',h:0}];
const PIL=[[[2,3],[8,3]],[[2,2],[8,2],[2,7],[8,7]],[[3,3],[7,3],[3,7],[7,7]],[[2,5],[8,5]],[[2,2],[8,2],[2,8],[8,8]]];

// =========================
let g=document.getElementById('c').getContext('2d');const cv=document.getElementById('c'),MG=g;

const sc=mkc(),dk=mkc(),SG=sc.getContext('2d'),DG=dk.getContext('2d');

let room=0,t0=0,left=TIME,pen=0,modal=null,over=0,near=null,fade=1,toast='',toastT=0,last=Date.now(),E=[],drops=[],parts=[],grace=1.5,shake=0,flash=0,danger=0;

function poly(p,f,s){g.beginPath();p.forEach((q,i)=>i?g.lineTo(...q):g.moveTo(...q));g.closePath();if(f){g.fillStyle=f;g.fill()}if(s){g.strokeStyle=s;g.stroke()}}
function ln(a,b,c,w){g.strokeStyle=c;g.lineWidth=w||1;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();g.lineWidth=1}
function bx(x,y,w,d,h,c,z0=0){const[H,S,L]=c,a=[x-w,y-d],b=[x+w,y-d],cc=[x+w,y+d],e=[x-w,y+d];
 poly([iso(...e,z0),iso(...cc,z0),iso(...cc,z0+h),iso(...e,z0+h)],hsl(H,S,L),'#000');
 poly([iso(...cc,z0),iso(...b,z0),iso(...b,z0+h),iso(...cc,z0+h)],hsl(H,S,L*.6),'#000');
 poly([iso(...a,z0+h),iso(...b,z0+h),iso(...cc,z0+h),iso(...e,z0+h)],hsl(H,S,Math.min(80,L*1.3)),'#000')}
function cyl(sx,sy,r,h,c1,c2,c3,ct){const gr=g.createLinearGradient(sx-r,0,sx+r,0);gr.addColorStop(0,c1);gr.addColorStop(.4,c2);gr.addColorStop(1,c3);
 g.fillStyle=gr;g.beginPath();g.moveTo(sx-r,sy-h);g.lineTo(sx-r,sy);g.ellipse(sx,sy,r,r/2,0,Math.PI,0,true);g.lineTo(sx+r,sy-h);g.ellipse(sx,sy-h,r,r/2,0,0,Math.PI);g.closePath();g.fill();
 g.fillStyle=ct||c2;g.beginPath();g.ellipse(sx,sy-h,r,r/2,0,0,7);g.fill()}
const sh=(x,y,r,a=.4)=>{g.fillStyle=`rgba(0,0,0,${a})`;g.beginPath();g.ellipse(x,y+2,r,r/2,0,0,7);g.fill()};

 [D('shelf',1,.45,0,0,SHY),D('shelf',9,.45,0,0,SHY),D('shelf',.45,1.9,0,0,SHX),D('shelf',.45,8.2,0,0,SHX),D('cand',3,5.6),D('cand',7,4.4),D('cand',4.2,2.8),D('bone',8.4,8.4),D('bar',8.8,8.7,.3,.3)],
 [D('tree',1,1.2,.35,.35),D('tree',9,1.5,.35,.35),D('tree',1.2,8.8,.35,.35),D('tree',8.8,8.6,.35,.35),D('mush',3.8,4.2),D('mush',6.3,6.1),D('mush',1.8,5.6),D('mush',8.4,5.2),D('mush',5.6,2),D('bone',4.6,8.4)],
 [D('crys',.9,3.6,.3,.3),D('crys',9.1,6.6,.3,.3),D('crys',5,9.1,.3,.2),D('rock',4,2.4,.35,.35),D('rock',6.3,8,.35,.35),D('bone',6.4,5.6)],
 [D('coff',1.1,5,.5,1),D('coff',8.9,5,.5,1),D('gold',1.3,8.8),D('gold',8.8,1.1),D('spike',3.8,1.3),D('spike',6.2,1.3),D('chest',8.9,8.9,.45,.35)]];
const POOL=[[],[],[],[[2.4,8,1.7,1],[8,1.9,1.4,1]],[]];
const TORCH=[[2,0],[8,0],[0,3],[0,7]];

// ===== INIMIGOS =====
const ET={sk:{hp:2,sp:1.35,ag:4.5,r:.4,dm:1},gh:{hp:2,sp:1.2,ag:6.5,r:.4,dm:1,fly:1},sp:{hp:1,sp:2,ag:4.2,r:.35,dm:1},sl:{hp:2,sp:1,ag:4.2,r:.45,dm:1},bt:{hp:1,sp:2.2,ag:5.5,r:.3,dm:1,fly:1},kn:{hp:6,sp:1.5,ag:10,r:.6,dm:2}};
const SPAWN=[
 [['sk',3,4],['sk',7.5,3]],
 [['gh',3,5],['gh',7.5,4]],
 [['sp',2,5],['sp',8,5.5],['sp',5,2.2]],
 [['sl',3,2.8],['sl',7,3.8],['bt',5,3],['bt',4,7]],
 [['kn',5,2.6],['gh',2,5],['gh',8,5]]];
function spawnE(){E=[];drops=[];if(!ENEMIES)return;SPAWN[room].forEach(([t,x,y])=>{const T=ET[t];E.push({t,x,y,hx:x,hy:y,hp:T.hp,mhp:T.hp,tx:x,ty:y,wt:0,kx:0,ky:0,hit:0,ph:Math.random()*6,dir:1,mv:0,st:0,cd:1+Math.random()*2,sw:0,ch:0,cx:0,cy:0,ag:0,dash:0})})}
const bossAlive=()=>BOSS_REQUIRED&&E.some(e=>e.t==='kn');

// ===== CAMADA ESTÁTICA (chão + paredes) =====
function rune(cx,cy,rad,col){g.save();g.shadowColor=col;g.shadowBlur=10;g.strokeStyle=col;g.fillStyle=col;g.lineWidth=1.5;
 const ring=r=>{g.beginPath();for(let i=0;i<=48;i++){const a=i/48*Math.PI*2,p=iso(cx+Math.cos(a)*r,cy+Math.sin(a)*r);i?g.lineTo(...p):g.moveTo(...p)}g.stroke()};ring(rad);ring(rad*.86);
 g.beginPath();for(let i=0;i<=5;i++){const a=i*Math.PI*4/5-Math.PI/2,p=iso(cx+Math.cos(a)*rad*.86,cy+Math.sin(a)*rad*.86);i?g.lineTo(...p):g.moveTo(...p)}g.stroke();
 for(let i=0;i<16;i++){const a=i/16*Math.PI*2,p=iso(cx+Math.cos(a)*rad*.93,cy+Math.sin(a)*rad*.93);g.fillRect(p[0]-1,p[1]-1,3,2)}
 g.restore();g.lineWidth=1}
function banner(w,u,c1,c2){const A=WA(w);ln(A(u-.08,81),A(u+.78,81),'#3a2410',3);
 poly([A(u,80),A(u+.7,80),A(u+.7,30),A(u+.35,16),A(u,30)],c1,'#000');poly([A(u+.08,74),A(u+.62,74),A(u+.62,34),A(u+.35,24),A(u+.08,34)],null,c2);
 const e=A(u+.35,54);g.fillStyle=c2;g.beginPath();g.arc(e[0],e[1],6,0,7);g.fill();g.fillStyle=c1;g.beginPath();g.arc(e[0],e[1],2.5,0,7);g.fill()}
function windowW(w,u){const A=WA(w),pts=[A(u,34)];for(let k=0;k<=12;k++){const a=Math.PI*k/12;pts.push(A(u+.6-.6*Math.cos(a),64+17*Math.sin(a)))}pts.push(A(u+1.2,34));
 g.save();g.beginPath();pts.forEach((q,i)=>i?g.lineTo(...q):g.moveTo(...q));g.closePath();g.clip();
 const gr=g.createLinearGradient(0,A(u,82)[1],0,A(u,34)[1]);gr.addColorStop(0,'#101a40');gr.addColorStop(1,'#2a3a6a');g.fillStyle=gr;g.fillRect(0,0,900,560);
 const m=A(u+.85,64);g.fillStyle='#eef3ff';g.beginPath();g.arc(m[0],m[1],5,0,7);g.fill();g.fillStyle='#10183a';g.beginPath();g.arc(m[0]+2,m[1]-1,4.2,0,7);g.fill();
 for(let i=0;i<7;i++){const s=A(u+.1+(i*.37)%1.0,40+(i*13)%34);g.fillStyle='rgba(255,255,255,.7)';g.fillRect(s[0],s[1],1.5,1.5)}g.restore();
 ln(A(u+.4,34),A(u+.4,78),'#05070f',2);ln(A(u+.8,34),A(u+.8,78),'#05070f',2);ln(A(u,52),A(u+1.2,52),'#05070f',2);
 g.strokeStyle=st(40);g.lineWidth=4;g.beginPath();pts.forEach((q,i)=>i?g.lineTo(...q):g.moveTo(...q));g.closePath();g.stroke();g.lineWidth=1}
function web(w){const A=WA(w),pts=[[1.9,WH],[1.6,WH-15],[1.1,WH-28],[.5,WH-36],[0,WH-38]];g.strokeStyle='rgba(225,225,235,.28)';g.lineWidth=1;
 pts.forEach(p=>ln(A(0,WH),A(...p),'rgba(225,225,235,.28)'));
 for(let r=.35;r<=1;r+=.22){g.beginPath();pts.forEach((p,i)=>{const q=A(p[0]*r,WH-(WH-p[1])*r);if(i)g.quadraticCurveTo(...[(q[0]+g.__l[0])/2,(q[1]+g.__l[1])/2+5],...q);else g.moveTo(...q);g.__l=q});g.stroke()}}
function buildStatic(){g=SG;g.clearRect(0,0,900,560);const h=R[room].h,rn=rnd(room*131+7),sat=room==4?26:room==0?22:15;
 poly([iso(0,N),iso(N,N),iso(N,N,-16),iso(0,N,-16)],'#0e0b09','#000');poly([iso(N,N),iso(N,0),iso(N,0,-16),iso(N,N,-16)],'#070605','#000');
 for(let x=0;x<N;x++)for(let y=0;y<N;y++){const n=rn(),L=15+((x+y)%2)*3+n*6;
  poly([iso(x,y),iso(x+1,y),iso(x+1,y+1),iso(x,y+1)],hsl(h,sat,L));
  ln(iso(x,y),iso(x+1,y),hsl(h,sat,L+14,.5));ln(iso(x,y),iso(x,y+1),hsl(h,sat,L+10,.4));ln(iso(x+1,y),iso(x+1,y+1),'rgba(0,0,0,.6)');ln(iso(x,y+1),iso(x+1,y+1),'rgba(0,0,0,.6)');
  for(let k=0;k<7;k++){const p=iso(x+rn(),y+rn());g.fillStyle=rn()>.5?'rgba(0,0,0,.2)':'rgba(255,255,255,.05)';g.fillRect(p[0],p[1],2,1)}
  if(n>.8){const a=iso(x+.3,y+.4),b=iso(x+.6,y+.7);g.strokeStyle='rgba(0,0,0,.55)';g.beginPath();g.moveTo(...a);g.lineTo(a[0]+7,a[1]+3);g.lineTo(a[0]+11,a[1]-1);g.lineTo(...b);g.stroke()}
  if(rn()<(room==2?.4:.07)){const p=iso(x+.5,y+.5);g.fillStyle=hsl(110,35,room==2?24:16,.55);for(let k=0;k<4;k++){g.beginPath();g.ellipse(p[0]+(rn()-.5)*22,p[1]+(rn()-.5)*9,6+rn()*7,3+rn()*3,0,0,7);g.fill()}}}
 if(room==0||room==4){const c=room==4;poly([iso(4.2,0),iso(5.8,0),iso(5.8,N),iso(4.2,N)],c?'#3c0a0a':'#561313','#000');
  ln(iso(4.3,0),iso(4.3,N),'#c9a24a',1.5);ln(iso(5.7,0),iso(5.7,N),'#c9a24a',1.5);
  for(let y=.5;y<N;y++)poly([iso(5,y-.3),iso(5.3,y),iso(5,y+.3),iso(4.7,y)],null,'#c9a24a')}
 if(room==1)rune(5,5,2.6,'rgba(180,140,255,.55)');
 if(room==4)rune(5,5,3.1,'rgba(255,60,50,.5)');
 if(room==3){g.fillStyle='rgba(30,18,10,.5)';for(let i=0;i<14;i++){const p=iso(.8+rn()*8.4,.8+rn()*8.4);g.beginPath();g.ellipse(p[0],p[1],14+rn()*16,6+rn()*7,0,0,7);g.fill()}
  POOL[3].forEach(([cx,cy,rx,ry])=>{const ring=(k,f)=>{g.beginPath();for(let i=0;i<=36;i++){const a=i/36*6.2832,w=1+Math.sin(a*3+cx)*.08,p=iso(cx+Math.cos(a)*rx*k*w,cy+Math.sin(a)*ry*k*w);i?g.lineTo(...p):g.moveTo(...p)}g.closePath();g.fillStyle=f;g.fill()};ring(1.12,'#2a2a30');ring(1,'#0b2640');ring(.7,'#123a5e')})}
 if(room==2){for(let i=0;i<70;i++){const p=iso(.4+rn()*9.2,.4+rn()*9.2);g.strokeStyle=hsl(105+rn()*25,40,18+rn()*10,.8);g.lineWidth=1.3;for(let k=0;k<3;k++){g.beginPath();g.moveTo(p[0]+k*2,p[1]);g.lineTo(p[0]+k*2+(k-1)*3,p[1]-5-rn()*4);g.stroke()}}g.lineWidth=1}
 // paredes
 for(const w of[0,1]){const A=WA(w),base=w?27:22;
  for(let row=0;row<10;row++){const z=row*9,off=(row%2)*.25;
   for(let i=-1;i<21;i++){let u0=i*.5+off,u1=u0+.5;u0=Math.max(0,u0);u1=Math.min(N,u1);if(u1-u0<.06)continue;
    const L=base-row*.8+(rn()-.5)*8;poly([A(u0,z),A(u1,z),A(u1,z+9),A(u0,z+9)],hsl(h,sat-4,L),'rgba(0,0,0,.6)');
    ln(A(u0,z+8.5),A(u1,z+8.5),'rgba(255,255,255,.07)');if(rn()>.93){const c=A(u0+.25,z+4);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(c[0],c[1],3,2)}}}
  poly([A(0,0),A(N,0),A(N,6),A(0,6)],hsl(h,sat-4,13),'#000');poly([A(0,84),A(N,84),A(N,WH),A(0,WH)],hsl(h,sat-4,12),'#000');ln(A(0,84),A(N,84),'rgba(255,255,255,.12)')}
 poly([iso(0,-.4,WH),iso(N,-.4,WH),iso(N,0,WH),iso(0,0,WH)],st(34,sat-4),'#000');poly([iso(-.4,0,WH),iso(0,0,WH),iso(0,N,WH),iso(-.4,N,WH)],st(40,sat-4),'#000');
 const c0=iso(0,0);cyl(c0[0],c0[1]+3,12,WH+2,st(18),st(32),st(10),st(38));
 // decoração das paredes

function loop(){const n=Date.now(),dt=Math.min(.05,(n-last)/1000);last=n;fade=Math.max(0,fade-dt*1.5);toastT-=dt;shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);
 if(!modal&&!over){P.inv=Math.max(0,P.inv-dt);P.cd=Math.max(0,P.cd-dt);P.at=Math.max(0,P.at-dt);grace=Math.max(0,grace-dt);
  let dx=0,dy=0;const k=keys;if(k.w||k.arrowup){dx--;dy--}if(k.s||k.arrowdown){dx++;dy++}if(k.a||k.arrowleft){dx--;dy++}if(k.d||k.arrowright){dx++;dy--}
  k.m=dx||dy;if(k.m){if(!t0)t0=n;const l=Math.hypot(dx,dy),sp=3.4*dt/l;P.fx=dx/l;P.fy=dy/l;if(Math.abs(P.fx-P.fy)>.1)P.dir=(P.fx-P.fy)>0?1:-1;movP(dx*sp,dy*sp)}
  if(P.kx||P.ky){movP(P.kx*dt,P.ky*dt);const f=Math.pow(.003,dt);P.kx*=f;P.ky*=f;if(Math.abs(P.kx)+Math.abs(P.ky)<.3)P.kx=P.ky=0}
  updE(dt);drops=drops.filter(o=>{if(Math.hypot(P.x-o.x,P.y-o.y)<.7&&P.hp<PLAYER_HP){P.hp++;sfx('pick');say('❤ +1 vida');return false}return true})}
 updParts(dt);
 if(t0&&!over){left=Math.max(0,TIME-pen-((n-t0)/1000|0));if(!left)end(false)}
 document.getElementById('t').textContent=fmt(left);document.getElementById('rm').innerHTML='Sala <b>'+(room+1)+'/5</b> · Enigmas <b>'+solved.filter(Boolean).length+'/4</b>';
 near=null;if(room<4&&Math.hypot(P.x-5,P.y-5)<1.6)near='altar';if(Math.hypot(P.x-5,P.y-.5)<1.5)near='door';
 document.getElementById('hint').textContent=modal||over?'':near==='altar'?'E — examinar o enigma desta sala':near==='door'?(room<4?(solved[room]?'E — avançar para a próxima sala ➜':'🔒 A porta está selada — resolve o enigma'):bossAlive()?'⚔ O Cavaleiro Negro guarda o cofre — derrota-o!':'E — usar o cofre 🔒'):'';
 draw();requestAnimationFrame(loop)}
function open(id){modal=id;document.getElementById(id).classList.add('on')}
function closeM(){if(modal){document.getElementById(modal).classList.remove('on');modal=null}}
function say(t){toast=t;toastT=3}
function showClue(){const r=R[room];document.getElementById('m1t').textContent=r.n;document.getElementById('m1p').textContent=r.t;document.getElementById('m1m').textContent='';
 const b=document.getElementById('m1b');b.innerHTML='';const im=new Image();im.alt=r.n;b.appendChild(im);
 const base=IMG[r.k].replace(/\.\w+$/,''),nfd=base.normalize('NFD'),asc=nfd.replace(/[\u0300-\u036f]/g,''),c=[];if(found[r.k])c.push(found[r.k]);
 [base.normalize('NFC'),nfd,asc,asc.toLowerCase()].forEach(n=>['jpeg','jpg','png','JPG','JPEG','PNG'].forEach(e=>c.push(n+'.'+e)));
 const list=[...new Set([...c.map(n=>/^http/.test(n)?n:BASE+n),...c])];let i=0;im.onload=()=>{found[r.k]=list[i]};
 im.onerror=()=>{if(++i<list.length)im.src=encodeURI(list[i]);else b.innerHTML='<p>⚠ Não encontrei a imagem <b>'+IMG[r.k]+'</b>. Confirma que está na mesma pasta do index.html.</p>'};im.src=encodeURI(list[0]);
 const a=document.getElementById('ans');a.value='';open('m1');setTimeout(()=>a.focus(),50)}
function check(){const a=document.getElementById('ans'),m=document.getElementById('m1m');
 if(solved[room]){m.textContent='Já resolveste este enigma!';return}
 if(a.value.trim()===R[room].a){solved[room]=1;closeM();sfx('open');say('🔓 Enigma resolvido! Dígito '+(room+1)+': '+R[room].a+' — a porta abriu-se.')}
 else{sfx('err');m.style.color='#ff6a5a';m.textContent='❌ Resposta errada… tenta contar outra vez.';const b=document.getElementById('m1x');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}}
function interact(){if(modal||over)return;
 if(near==='altar')showClue();
 else if(near==='door'){if(room===4){if(bossAlive())say('⚔ O Cavaleiro Negro guarda o cofre — derrota-o primeiro!');else{open('m3');setTimeout(()=>code[0].focus(),50)}}
  else if(solved[room]){room++;P.x=5;P.y=8.5;P.kx=P.ky=0;fade=1;grace=1.6;spawnE();buildStatic();setRoom(room);say(R[room].n+(ENEMIES?' — cuidado com o que ronda aqui…':''))}
  else say('🔒 A porta está selada. Resolve primeiro o enigma da sala.')}}
function passport(){let h='<p style="font-size:14px">Resolvei o enigma de cada sala para abrir a porta. No fim, juntai os 4 dígitos para abrir o cofre. Os monstros são opcionais — exceto o Cavaleiro Negro, que guarda o cofre. <b>Espaço</b> ataca.</p><div class="row" style="font-size:30px;color:#ffb347">';
 R.slice(0,4).forEach((r,i)=>h+=`<span class="d" style="display:inline-block;line-height:52px">${solved[i]?r.a:'?'}</span>`);h+='</div>';
 R.slice(0,4).forEach(r=>h+=`<div class="ch"><b style="color:${r.c}">${r.n}</b><br>${r.t}</div>`);document.getElementById('pp').innerHTML=h;open('m2')}
const code=[];for(let i=0;i<4;i++){const e=document.createElement('input');e.className='d';e.maxLength=1;e.inputMode='numeric';e.autocomplete='off';
 e.oninput=()=>{e.value=e.value.replace(/\D/g,'');if(e.value&&e.nextElementSibling)e.nextElementSibling.focus()};
 e.onkeydown=ev=>{ev.stopPropagation();if(ev.key==='Backspace'&&!e.value&&e.previousElementSibling)e.previousElementSibling.focus();if(ev.key==='Enter')tryCode();if(ev.key==='Escape')closeM()};
 document.getElementById('code').appendChild(e);code.push(e)}
document.getElementById('ans').onkeydown=ev=>{ev.stopPropagation();if(ev.key==='Enter')check();if(ev.key==='Escape')closeM()};
function tryCode(){const v=code.map(e=>e.value).join(''),m=document.getElementById('msg');
 if(v===CODE){closeM();end(true)}else{sfx('err');m.style.color='#ff6a5a';m.textContent=v.length<4?'Faltam dígitos!':'❌ Combinação errada…';const b=document.getElementById('m3b');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}}
function end(w){over=w?'win':'lose';closeM();if(w)sfx('open');setTimeout(()=>{document.getElementById('m4t').textContent=w?'🎉 O cofre abriu-se!':'⌛ O tempo esgotou-se…';
 document.getElementById('m4p').textContent=w?'Escapastes da Cripta de D. Sebastião com '+fmt(left)+' de sobra. Parabéns, equipa!':'A escuridão tomou conta da cripta. Tentai outra vez!';open('m4')},w?900:0)}
function press(k){k=k.toLowerCase();if(modal){if(k==='escape')closeM();else if(k==='p'&&modal==='m2')closeM();return}
 if(k==='e')interact();else if(k===' '||k==='j'||k==='x')attack();else if(k==='p')passport();else if(k==='m')toggleSnd();else keys[k]=1}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();press(e.key)});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;b.ontouchstart=ev=>{ev.preventDefault();press(k)};b.ontouchend=()=>{keys[k]=0};b.onmousedown=()=>press(k);b.onmouseup=()=>{keys[k]=0}});

// ===== ÁUDIO: música sombria gerada em tempo real (sem ficheiros) =====
const ROOT=[55,49,46.25,41.2,36.71],PHR=[0,1,3,5,7,8,10],Aud={ctx:null,mute:false,danger:0,nbt:0,nh:0,nbm:0,root:55};
function startAudio(){if(Aud.ctx){if(Aud.ctx.state==='suspended')Aud.ctx.resume();return}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const C=Aud.ctx=new AC(),M=Aud.m=C.createGain(),cmp=C.createDynamicsCompressor();M.gain.value=Aud.mute?0:.8;M.connect(cmp);cmp.connect(C.destination);
 const len=C.sampleRate*4,buf=C.createBuffer(2,len,C.sampleRate);for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4)}
 const cn=C.createConvolver();cn.buffer=buf;const wet=Aud.wet=C.createGain(),rv=C.createGain();wet.gain.value=.9;rv.gain.value=.7;wet.connect(cn);cn.connect(rv);rv.connect(M);
 const nb=Aud.noise=C.createBuffer(1,C.sampleRate*2,C.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
 if(MUSIC_FILE){const a=new Audio(MUSIC_FILE);a.loop=true;a.volume=.5;a.muted=Aud.mute;a.play().catch(()=>{});Aud.file=a;return}
 const lfo=(f,a,p)=>{const o=C.createOscillator(),gn=C.createGain();o.frequency.value=f;gn.gain.value=a;o.connect(gn);gn.connect(p);o.start()};
 const dg=C.createGain();dg.gain.value=.16;const f=Aud.f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=220;f.Q.value=3;f.connect(dg);dg.connect(M);dg.connect(wet);
 Aud.osc=[[1,'sawtooth',0],[1,'sawtooth',9],[.5,'sine',0],[2,'triangle',-6]].map(([m,ty,dt])=>{const o=C.createOscillator();o.type=ty;o.detune.value=dt;o.frequency.value=ROOT[0]*m;o.connect(f);o.start();return[o,m]});lfo(.07,110,f.frequency);
 const pg=C.createGain();pg.gain.value=.028;pg.connect(M);pg.connect(wet);lfo(.05,.02,pg.gain);
 Aud.pad=[4,4.2378,6].map(m=>{const o=C.createOscillator();o.type='sine';o.frequency.value=ROOT[0]*m;o.connect(pg);o.start();return[o,m]});
 const tg=Aud.tg=C.createGain();tg.gain.value=0;const tf=C.createBiquadFilter();tf.type='lowpass';tf.frequency.value=500;tf.connect(tg);tg.connect(M);
 Aud.ten=[2,2.828].map(m=>{const o=C.createOscillator();o.type='sawtooth';o.frequency.value=ROOT[0]*m;o.connect(tf);o.start();return[o,m]});
 const ns=C.createBufferSource();ns.buffer=nb;ns.loop=true;const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=380;bp.Q.value=.7;const wg=C.createGain();wg.gain.value=.05;ns.connect(bp);bp.connect(wg);wg.connect(M);ns.start();lfo(.11,.035,wg.gain);lfo(.05,200,bp.frequency);
 setInterval(musicTick,200);setRoom(room)}
function setRoom(r){if(!Aud.ctx||MUSIC_FILE||!Aud.osc)return;Aud.root=ROOT[r];const T=Aud.ctx.currentTime;[...Aud.osc,...Aud.pad,...Aud.ten].forEach(([o,m])=>o.frequency.setTargetAtTime(ROOT[r]*m,T,1.5))}
function bell(){const C=Aud.ctx,t=C.currentTime,f=Aud.root*Math.pow(2,(PHR[Math.random()*PHR.length|0]+12*(2+(Math.random()*2|0)))/12);
 [[1,.09],[2.76,.04],[5.4,.015]].forEach(([m,v])=>{const o=C.createOscillator(),gn=C.createGain();o.type='sine';o.frequency.value=f*m;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v,t+.01);gn.gain.exponentialRampToValueAtTime(.0001,t+5);o.connect(gn);gn.connect(Aud.wet);gn.connect(Aud.m);o.start(t);o.stop(t+5.2)})}
function thump(t,v,f0=95,f1=38,d=.25){const C=Aud.ctx,o=C.createOscillator(),gn=C.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d*.7);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(Aud.m);if(d>.5)gn.connect(Aud.wet);o.start(t);o.stop(t+d+.05)}
function musicTick(){const C=Aud.ctx;if(!C||Aud.mute||MUSIC_FILE)return;const t=C.currentTime;Aud.danger+=(danger-Aud.danger)*.15;
 Aud.tg.gain.setTargetAtTime(Aud.danger*.07,t,.4);Aud.f.frequency.setTargetAtTime(220+Aud.danger*380,t,.5);
 if(t>Aud.nbt){bell();Aud.nbt=t+3.5+Math.random()*6-Aud.danger*2.5}
 const bpm=Aud.danger>.3?100:(t0&&left<90&&!over?66:0);if(bpm&&t>Aud.nh){thump(t,.5);thump(t+.22,.35);Aud.nh=t+60/bpm}
 if(t>Aud.nbm){thump(t,.5,70,28,1.4);Aud.nbm=t+9+Math.random()*9}}
function sfx(n){const C=Aud.ctx;if(!C||Aud.mute)return;const t=C.currentTime;
 const T=(f1,f2,d,ty,v,dl=0,w=0)=>{const o=C.createOscillator(),gn=C.createGain();o.type=ty;o.frequency.setValueAtTime(f1,t+dl);o.frequency.exponentialRampToValueAtTime(f2,t+dl+d);gn.gain.setValueAtTime(v,t+dl);gn.gain.exponentialRampToValueAtTime(.001,t+dl+d);o.connect(gn);gn.connect(Aud.m);if(w)gn.connect(Aud.wet);o.start(t+dl);o.stop(t+dl+d+.05)};
 const Nz=(f,q,d,v,dl=0)=>{const s=C.createBufferSource();s.buffer=Aud.noise;const b=C.createBiquadFilter();b.type='bandpass';b.frequency.value=f;b.Q.value=q;const gn=C.createGain();gn.gain.setValueAtTime(v,t+dl);gn.gain.exponentialRampToValueAtTime(.001,t+dl+d);s.connect(b);b.connect(gn);gn.connect(Aud.m);s.start(t+dl,Math.random(),d+.05)};
 const S={swing:()=>Nz(1800,.8,.18,.22),hit:()=>{T(180,50,.15,'square',.25);Nz(900,1,.1,.3)},kill:()=>{T(220,40,.4,'sawtooth',.2,0,1);Nz(400,.7,.3,.25)},hurt:()=>{T(260,70,.3,'sawtooth',.3);Nz(300,.6,.25,.3)},
  pick:()=>{T(660,660,.12,'sine',.2,0,1);T(990,990,.2,'sine',.18,.1,1)},die:()=>T(200,30,1.4,'sawtooth',.3,0,1),open:()=>{Nz(120,.5,1.1,.5);[0,.15,.3,.45].forEach((d,i)=>T(440*Math.pow(1.25,i),440*Math.pow(1.25,i),1.4,'sine',.14,d,1))},err:()=>T(150,100,.25,'square',.15)};(S[n]||(()=>{}))()}
function toggleSnd(){Aud.mute=!Aud.mute;if(Aud.m)Aud.m.gain.setTargetAtTime(Aud.mute?0:.8,Aud.ctx.currentTime,.1);if(Aud.file)Aud.file.muted=Aud.mute;document.getElementById('snd').textContent=Aud.mute?'🔇':'🔊'}
['keydown','pointerdown','touchend','click'].forEach(ev=>addEventListener(ev,startAudio,true));

spawnE();buildStatic();say('Espaço — atacar · E — interagir · P — passaporte');loop();
