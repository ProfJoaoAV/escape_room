<script>
// ===== CONFIGURAÇÃO =====
let TIME=600; // segundos
const BASE="https://profjoaoav.github.io/escape_room/"; // endereço das imagens
const IMG={hgp:"HGP.jpeg",port:"Portugues.jpeg",eng:"Ingles.jpeg",cien:"Ciencias.jpeg"}; // mesma pasta do index.html
let ENEMIES=true;      // escolhido no menu inicial (false = jogo sem inimigos)

let PENALTY=30;        // segundos perdidos ao morrer

const MUSIC_FILE="";     // opcional: ficheiro mp3 próprio (ex: "musica.mp3"). Vazio = música sombria gerada pelo código
const R=[
{n:'Sala I · HGP — Dinastia de Avis',k:'hgp',a:'7',c:'#e8b94a',g:'232,185,74',h:35,i:'👑',t:'Contai a ordem de sucessão dos reis da Dinastia de Avis, desde o fundador até D. Sebastião. A posição de D. Sebastião é o dígito.'},
{n:'Sala II · Português — Profecia do Guardião',k:'port',a:'6',c:'#b48cff',g:'180,140,255',h:270,i:'📜',t:'Lede o papiro e contai todos os ADJETIVOS. O total é o dígito.'},
{n:'Sala III · English — The Foggy Forest',k:'eng',a:'2',c:'#6fe39a',g:'111,227,154',h:140,i:'🦊',t:'Count the animals: Red Foxes + Green Frogs − Black Cats = Secret Number.'},
{n:'Sala IV · Ciências — Lago e solo',k:'cien',a:'4',c:'#5fc8ff',g:'95,200,255',h:200,i:'🐌',t:'Contai os invertebrados / animais rastejantes assinalados na gravura. O total é o dígito.'},
{n:'Sala V · O Cofre de D. Sebastião',c:'#ff5a4a',g:'255,90,74',h:0}];
const PIL=[[[2,3],[8,3]],[[2,2],[8,2],[2,7],[8,7]],[[3,3],[7,3],[3,7],[7,7]],[[2,5],[8,5]],[[2,2],[8,2],[2,8],[8,8]]];
const CODE=R.slice(0,4).map(r=>r.a).join('');
// =========================
let g=document.getElementById('c').getContext('2d');const cv=document.getElementById('c'),MG=g;
// ===== V9: ALTA RESOLUÇÃO =====
// HQ = fator de nitidez (1 = como antes, 2 = o dobro de píxeis). Automático pelo ecrã; força-se com ?hd=0 (leve) ou ?hd=2 (nítido) no endereço.
const HQ=(()=>{let q=null;try{q=new URLSearchParams(location.search).get('hd')}catch(e){}if(q==='0'||q==='1')return 1;if(q==='2')return 2;return Math.max(1,Math.min(2,Math.ceil(window.devicePixelRatio||1)))})();
let SS=HQ;cv.width=900*SS;cv.height=560*SS;
const mkc=()=>{const c=document.createElement('canvas');c.width=900;c.height=560;return c};
const sc=mkc(),dk=mkc(),SG=sc.getContext('2d'),DG=dk.getContext('2d'),fw=mkc(),FG=fw.getContext('2d');
const N=15,CN=N/2,TW=64,TH=32,OX=450,OY=135,WH=90;
const P={x:5,y:8.5,fx:0,fy:-1,dir:1,hp:PLAYER_HP,inv:0,cd:0,at:0,kx:0,ky:0,pitch:0},keys={},solved=[],found={};
let room=0,t0=0,left=TIME,pen=0,modal=null,over=0,near=null,fade=1,toast='',toastT=0,last=Date.now(),E=[],drops=[],parts=[],grace=1.5,shake=0,flash=0,danger=0;
const iso=(x,y,z=0)=>[OX+(x-y)*TW/2,OY+(x+y)*TH/2-z];
const hs=(x,y,r)=>{const v=Math.sin(x*127.1+y*311.7+r*74.7)*43758.5453;return v-Math.floor(v)};
const rnd=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hsl=(h,s,l,a=1)=>`hsla(${h},${s}%,${l}%,${a})`;
const st=(l,s=12,a=1)=>hsl(R[room].h,s,l,a);
function poly(p,f,s){g.beginPath();p.forEach((q,i)=>i?g.lineTo(...q):g.moveTo(...q));g.closePath();if(f){g.fillStyle=f;g.fill()}if(s){g.strokeStyle=s;g.stroke()}}
function ln(a,b,c,w){g.strokeStyle=c;g.lineWidth=w||1;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();g.lineWidth=1}
function bx(x,y,w,d,h,c,z0=0){const[H,S,L]=c,a=[x-w,y-d],b=[x+w,y-d],cc=[x+w,y+d],e=[x-w,y+d];
 poly([iso(...e,z0),iso(...cc,z0),iso(...cc,z0+h),iso(...e,z0+h)],hsl(H,S,L),'#000');
 poly([iso(...cc,z0),iso(...b,z0),iso(...b,z0+h),iso(...cc,z0+h)],hsl(H,S,L*.6),'#000');
 poly([iso(...a,z0+h),iso(...b,z0+h),iso(...cc,z0+h),iso(...e,z0+h)],hsl(H,S,Math.min(80,L*1.3)),'#000')}
function cyl(sx,sy,r,h,c1,c2,c3,ct){const gr=g.createLinearGradient(sx-r,0,sx+r,0);gr.addColorStop(0,c1);gr.addColorStop(.4,c2);gr.addColorStop(1,c3);
 g.fillStyle=gr;g.beginPath();g.moveTo(sx-r,sy-h);g.lineTo(sx-r,sy);g.ellipse(sx,sy,r,r/2,0,Math.PI,0,true);g.lineTo(sx+r,sy-h);g.ellipse(sx,sy-h,r,r/2,0,0,Math.PI);g.closePath();g.fill();
 g.fillStyle=ct||c2;g.beginPath();g.ellipse(sx,sy-h,r,r/2,0,0,7);g.fill()}
const sh=(x,y,r,a=.4)=>{g.fillStyle=`rgba(0,0,0,${a})`;g.beginPath();g.ellipse(x,y+2,r,r/2,0,0,7);g.fill()};
const WA=w=>w?(u,z)=>iso(0,u,z):(u,z)=>iso(u,0,z);

// ===== SALAS: decoração, poças, tochas =====
const D=(t,x,y,bw=0,bd=0,o={})=>({t,x,y,bw,bd,...o});
const SHY={sw:.7,sd:.45,h:72,o:'y'},SHX={sw:.45,sd:.8,h:72,o:'x'};
const DECOR=[
 [D('bar',.9,8.7,.3,.3),D('bar',1.7,9.1,.3,.3),D('crt',9,8.6,.38,.38),D('coff',9.1,4.4,.5,1),D('bone',2.8,6.7),D('skull',7.6,7.9),D('cand',3.4,1.3),D('cand',6.6,1.3)],
 [D('shelf',1,.45,0,0,SHY),D('shelf',9,.45,0,0,SHY),D('shelf',.45,1.9,0,0,SHX),D('shelf',.45,8.2,0,0,SHX),D('cand',3,5.6),D('cand',7,4.4),D('cand',4.2,2.8),D('bone',8.4,8.4),D('bar',8.8,8.7,.3,.3)],
 [D('tree',1,1.2,.35,.35),D('tree',9,1.5,.35,.35),D('tree',1.2,8.8,.35,.35),D('tree',8.8,8.6,.35,.35),D('mush',3.8,4.2),D('mush',6.3,6.1),D('mush',1.8,5.6),D('mush',8.4,5.2),D('mush',5.6,2),D('bone',4.6,8.4)],
 [D('crys',.9,3.6,.3,.3),D('crys',9.1,6.6,.3,.3),D('crys',5,9.1,.3,.2),D('rock',4,2.4,.35,.35),D('rock',6.3,8,.35,.35),D('bone',6.4,5.6)],
 [D('coff',1.1,5,.5,1),D('coff',8.9,5,.5,1),D('gold',1.3,8.8),D('gold',8.8,1.1),D('spike',3.8,1.3),D('spike',6.2,1.3),D('chest',8.9,8.9,.45,.35)]];
const POOL=[[],[],[],[[2.4,8,1.7,1],[8,1.9,1.4,1]],[]];
const TORCH=[[2,0],[8,0],[0,3],[0,7]];

// ===== INIMIGOS =====
const ET={sk:{hp:2,sp:1.35,ag:4.5,r:.4,dm:1},gh:{hp:2,sp:1.2,ag:6.5,r:.4,dm:1,fly:1},sp:{hp:1,sp:2,ag:4.2,r:.35,dm:1},sl:{hp:2,sp:1,ag:4.2,r:.45,dm:1},bt:{hp:1,sp:2.2,ag:5.5,r:.3,dm:1,fly:1},kn:{hp:6,sp:1.5,ag:10,r:.6,dm:2}};
const SPAWN=[
 [['sk',3,4],['sk',6.5,5],['sk',2.5,6.5],['sk',8,6.5]],
 [['gh',3,5],['gh',7.5,4],['gh',5,2.4],['gh',2.5,2.5]],
 [['sp',2,5],['sp',8,5.5],['sp',5,2.2],['sp',3,7.5],['sp',7,2.5]],
 [['sl',3,2.8],['sl',7,3.8],['bt',5,3],['bt',4,7],['sl',2,5.5],['bt',8,7]],
 [['kn',5,2.6],['gh',2,5],['gh',8,5],['sk',3,7],['sk',7,7]]];
function mkE(t,x,y){const T=ET[t];return{t,x,y,hx:x,hy:y,hp:T.hp,mhp:T.hp,tx:x,ty:y,wt:0,kx:0,ky:0,hit:0,ph:Math.random()*6,dir:1,mv:0,st:0,cd:1+Math.random()*2,sw:0,ch:0,cx:0,cy:0,ag:0,dash:0}}
function spawnE(){E=[];drops=[];if(!ENEMIES)return;SPAWN[room].forEach(([t,x,y])=>E.push(mkE(t,x,y)))}
const bossAlive=()=>BOSS_REQUIRED&&E.some(e=>e.t==='kn');

// ===== CAMADA ESTÁTICA (chão + paredes) =====
function rune(cx,cy,rad,col){g.save();g.shadowColor=col;g.shadowBlur=10;g.strokeStyle=col;g.fillStyle=col;g.lineWidth=1.5;
 const ring=r=>{g.beginPath();for(let i=0;i<=48;i++){const a=i/48*Math.PI*2,p=iso(cx+Math.cos(a)*r,cy+Math.sin(a)*r);i?g.lineTo(...p):g.moveTo(...p)}g.stroke()};ring(rad);ring(rad*.86);
 g.beginPath();for(let i=0;i<=5;i++){const a=i*Math.PI*4/5-Math.PI/2,p=iso(cx+Math.cos(a)*rad*.86,cy+Math.sin(a)*rad*.86);i?g.lineTo(...p):g.moveTo(...p)}g.stroke();
 for(let i=0;i<16;i++){const a=i/16*Math.PI*2,p=iso(cx+Math.cos(a)*rad*.93,cy+Math.sin(a)*rad*.93);g.fillRect(p[0]-1,p[1]-1,3,2)}
 g.restore();g.lineWidth=1}
function banner(w,u,c1,c2){const A=WA(w);ln(A(u-.08,81),A(u+.78,81),'#3a2410',3);
 poly([A(u,80),A(u+.7,80),A(u+.7,30),A(u+.35,16),A(u,30)],c1,'#000');poly([A(u+.08,74),A(u+.62,74),A(u+.62,34),A(u+.35,24),A(u+.08,34)],null,c2);
 const e=A(u+.35,54);g.fillStyle=c2;g.beginPath();g.arc(e[0],e[1],6,0,7);g.fill();g.fillStyle=c1;g.beginPath();g.arc(e[0],e[1],2.5,0,7);g.fill()}
function windowW(w,u){const A=WA(w),pts=[A(u,34)];for(let k=0;k<=12;k++){const a=Math.PI*k/12;pts.push(A(u+.6-.6*Math.cos(a),64+17*Math.sin(a)))}pts.push(A(u+1.2,34));
 g.save();g.beginPath();pts.forEach((q,i)=>i?g.lineTo(...q):g.moveTo(...q));g.closePath();g.clip();
 const gr=g.createLinearGradient(0,A(u,82)[1],0,A(u,34)[1]);gr.addColorStop(0,'#101a40');gr.addColorStop(1,'#2a3a6a');g.fillStyle=gr;g.fillRect(0,0,900,560);
 const m=A(u+.85,64);g.fillStyle='#eef3ff';g.beginPath();g.arc(m[0],m[1],5,0,7);g.fill();g.fillStyle='#10183a';g.beginPath();g.arc(m[0]+2,m[1]-1,4.2,0,7);g.fill();
 for(let i=0;i<7;i++){const s=A(u+.1+(i*.37)%1.0,40+(i*13)%34);g.fillStyle='rgba(255,255,255,.7)';g.fillRect(s[0],s[1],1.5,1.5)}g.restore();
 ln(A(u+.4,34),A(u+.4,78),'#05070f',2);ln(A(u+.8,34),A(u+.8,78),'#05070f',2);ln(A(u,52),A(u+1.2,52),'#05070f',2);
 g.strokeStyle=st(40);g.lineWidth=4;g.beginPath();pts.forEach((q,i)=>i?g.lineTo(...q):g.moveTo(...q));g.closePath();g.stroke();g.lineWidth=1}
function web(w){const A=WA(w),pts=[[1.9,WH],[1.6,WH-15],[1.1,WH-28],[.5,WH-36],[0,WH-38]];g.strokeStyle='rgba(225,225,235,.28)';g.lineWidth=1;
 pts.forEach(p=>ln(A(0,WH),A(...p),'rgba(225,225,235,.28)'));
 for(let r=.35;r<=1;r+=.22){g.beginPath();pts.forEach((p,i)=>{const q=A(p[0]*r,WH-(WH-p[1])*r);if(i)g.quadraticCurveTo(...[(q[0]+g.__l[0])/2,(q[1]+g.__l[1])/2+5],...q);else g.moveTo(...q);g.__l=q});g.stroke()}}
function buildStatic(){g=SG;g.clearRect(0,0,900,560);const h=R[room].h,rn=rnd(room*131+7),sat=room==4?26:room==0?22:15;
 poly([iso(0,N),iso(N,N),iso(N,N,-16),iso(0,N,-16)],'#0e0b09','#000');poly([iso(N,N),iso(N,0),iso(N,0,-16),iso(N,N,-16)],'#070605','#000');
 for(let x=0;x<N;x++)for(let y=0;y<N;y++){const n=rn(),L=15+((x+y)%2)*3+n*6;
  poly([iso(x,y),iso(x+1,y),iso(x+1,y+1),iso(x,y+1)],hsl(h,sat,L));
  ln(iso(x,y),iso(x+1,y),hsl(h,sat,L+14,.5));ln(iso(x,y),iso(x,y+1),hsl(h,sat,L+10,.4));ln(iso(x+1,y),iso(x+1,y+1),'rgba(0,0,0,.6)');ln(iso(x,y+1),iso(x+1,y+1),'rgba(0,0,0,.6)');
  for(let k=0;k<7;k++){const p=iso(x+rn(),y+rn());g.fillStyle=rn()>.5?'rgba(0,0,0,.2)':'rgba(255,255,255,.05)';g.fillRect(p[0],p[1],2,1)}
  if(n>.8){const a=iso(x+.3,y+.4),b=iso(x+.6,y+.7);g.strokeStyle='rgba(0,0,0,.55)';g.beginPath();g.moveTo(...a);g.lineTo(a[0]+7,a[1]+3);g.lineTo(a[0]+11,a[1]-1);g.lineTo(...b);g.stroke()}
  if(rn()<(room==2?.4:.07)){const p=iso(x+.5,y+.5);g.fillStyle=hsl(110,35,room==2?24:16,.55);for(let k=0;k<4;k++){g.beginPath();g.ellipse(p[0]+(rn()-.5)*22,p[1]+(rn()-.5)*9,6+rn()*7,3+rn()*3,0,0,7);g.fill()}}}
 if(room==0||room==4){const c=room==4;poly([iso(4.2,0),iso(5.8,0),iso(5.8,N),iso(4.2,N)],c?'#3c0a0a':'#561313','#000');
  ln(iso(4.3,0),iso(4.3,N),'#c9a24a',1.5);ln(iso(5.7,0),iso(5.7,N),'#c9a24a',1.5);
  for(let y=.5;y<N;y++)poly([iso(5,y-.3),iso(5.3,y),iso(5,y+.3),iso(4.7,y)],null,'#c9a24a')}
 if(room==1)rune(5,5,2.6,'rgba(180,140,255,.55)');
 if(room==4)rune(5,5,3.1,'rgba(255,60,50,.5)');
 if(room==3){g.fillStyle='rgba(30,18,10,.5)';for(let i=0;i<14;i++){const p=iso(.8+rn()*8.4,.8+rn()*8.4);g.beginPath();g.ellipse(p[0],p[1],14+rn()*16,6+rn()*7,0,0,7);g.fill()}
